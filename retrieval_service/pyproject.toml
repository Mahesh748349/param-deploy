[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "param-retrieval"
version = "3.0.0"
description = "Incremental document ingestion and retrieval with replaceable infrastructure"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<2.1", "pydantic-settings>=2.7,<3",
  "qdrant-client>=1.14,<2", "fastembed>=0.6.1,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "ijson>=3.3,<4", "pillow>=11,<13", "numpy>=1.26,<3"
]
[project.optional-dependencies]
production = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "python-dotenv>=1.0,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
param-retrieval = "param_retrieval.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
