name: Retrieval tests

on:
  push:
    branches:
      - retrieval-deployment
      - main
      - demo-readiness-fixes
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: retrieval_service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: retrieval_service/pyproject.toml

      - name: Install dependencies
        run: python -m pip install ".[production,test]"

      - name: Run tests
        run: python -m pytest -q

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: backend
      - run: npm ci && npm test && npm run build && npm run lint
        working-directory: frontend
